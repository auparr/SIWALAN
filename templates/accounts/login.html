{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — SIWALAN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div class="login-page">
    <div class="login-box">
        <div class="login-brand">
            <div class="login-brand-icon">
                <img src="{% static 'img/logo.webp' %}" alt="Logo SIWALAN" class="login-logo-img">
            </div>
            <span class="login-brand-text">SIWALAN</span>
        </div>
        <p class="login-subtitle">Sistem Informasi Penjadwalan</p>

        {% if messages %}
        <div class="messages" style="margin-bottom: 1rem;">
            {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">NIP</label>
                <input type="text" id="username" name="username" placeholder="Masukkan NIP Anda" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary login-submit">Masuk</button>
        </form>
    </div>
</div>
</body>
</html>
